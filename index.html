<title>Prüfungstrainer E-Niveau</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,800;1,6..12,400&display=swap">
<style>
/* Layout: schmaler Prüfungsbogen, oben fester Zeitbalken; Ablauf Start → Teil 1 → Pause → Teil 2 → Auswertung */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --surface2:#e9f0fa; --ink:#12233d; --muted:#51627c; --line:#cfd9e8;
  --blue:#1d5fb0; --blue-d:#0f3a70; --blue-t:#dce9fa; --orange:#f58a1f; --orange-t:#fff0de; --orange-ink:#9a4300;
  --sol-bg:#fff5e8; --sol-ink:#b3300a; --ok:#1c8a4f; --ok-t:#dff3e7; --bad:#c0392b; --bad-t:#fde7e4; --warn:#b36b00;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --body:'Nunito Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1627; --surface:#14233b; --surface2:#1a2d4a; --ink:#e8eff9; --muted:#9db0cb; --line:#2a4064;
  --blue:#6aaaf0; --blue-d:#0a2342; --blue-t:#1c3558; --orange:#ffa047; --orange-t:#3a2a17; --orange-ink:#ffb978;
  --sol-bg:#2c2216; --sol-ink:#ff9a7a; --ok:#58d08e; --ok-t:#12301f; --bad:#ff8b7b; --bad-t:#3a1a16; --warn:#ffc15a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1627; --surface:#14233b; --surface2:#1a2d4a; --ink:#e8eff9; --muted:#9db0cb; --line:#2a4064;
  --blue:#6aaaf0; --blue-d:#0a2342; --blue-t:#1c3558; --orange:#ffa047; --orange-t:#3a2a17; --orange-ink:#ffb978;
  --sol-bg:#2c2216; --sol-ink:#ff9a7a; --ok:#58d08e; --ok-t:#12301f; --bad:#ff8b7b; --bad-t:#3a1a16; --warn:#ffc15a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;padding-inline:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.top{background:var(--blue-d);color:#fff;border-bottom:5px solid var(--orange)}
.top-in{max-width:900px;margin:0 auto;padding:16px 16px 14px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:end;justify-content:space-between}
.top h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,4.2vw,2.3rem);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.top h1 em{font-style:normal;color:var(--orange)}
.top p{margin:6px 0 0;color:#c7d9f2;font-size:.93rem;max-width:52ch}
.theme{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--line);box-shadow:0 4px 14px rgba(15,58,112,.08)}
.bar-in{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.bar .lbl{font-family:var(--display);font-weight:800;font-size:1.02rem;flex:1 1 12rem;min-width:0}
.bar .lbl small{display:block;font-family:var(--body);font-weight:600;font-size:.78rem;color:var(--muted)}
.clock{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums;background:var(--blue-t);color:var(--blue-d);border-radius:12px;padding:7px 14px;min-width:6.4rem;text-align:center}
:root[data-theme="dark"] .clock{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .clock{color:var(--ink)}}
.clock.warn{background:var(--orange-t);color:var(--orange-ink)}
.clock.danger{background:var(--bad-t);color:var(--bad)}
.clock.hide{letter-spacing:.2em}
.chips{max-width:900px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-weight:700;font-size:.85rem;cursor:pointer;text-decoration:none;color:var(--ink)}
.chip.on{background:var(--blue-t);border-color:var(--blue)}
.btn{border:2px solid var(--blue);background:var(--surface);color:var(--blue);border-radius:12px;padding:9px 16px;font-weight:800;cursor:pointer;font-family:var(--display)}
.btn:hover{background:var(--blue-t)}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#1b1100}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 11px;font-size:.88rem;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:default}
main{max-width:900px;margin:0 auto;padding:18px 16px 70px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px clamp(16px,3vw,30px) 24px;min-width:0}
h2{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,3.4vw,1.8rem);margin:0 0 6px;line-height:1.15;text-wrap:balance}
h3{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:0 0 8px}
.muted{color:var(--muted)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0 4px}
.fact{background:var(--blue-t);border-radius:10px;padding:10px 14px}
.fact b{display:block;font-family:var(--display);font-size:1.4rem;color:var(--blue);line-height:1.1}
:root[data-theme="dark"] .fact b{color:var(--ink)}
.fact span{font-size:.9rem;color:var(--muted)}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.pick{background:var(--surface2);border:2px solid transparent;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;min-width:0}
.pick:hover{border-color:var(--orange)}
.pick .n{font-family:var(--display);font-weight:800;font-size:2.6rem;color:var(--orange);line-height:1}
.pick b{font-family:var(--display);font-size:1.15rem}
.pick small{color:var(--muted)}
.pick .last{font-weight:800;color:var(--blue);font-size:.9rem}
.opts{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-top:14px}
.opts label{display:flex;gap:8px;align-items:center;font-weight:700}
.opts select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.opts input[type=checkbox]{width:18px;height:18px;accent-color:var(--orange)}
.banner{border-radius:12px;padding:10px 14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.nocalc{background:var(--orange-t);color:var(--orange-ink);border:1px solid var(--orange)}
.banner.calc{background:var(--ok-t);color:var(--ok);border:1px solid var(--ok)}
.banner.time{background:var(--bad-t);color:var(--bad);border:1px solid var(--bad)}
.task{scroll-margin-top:150px}
.task>h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.task .pt{font-size:.78rem;font-weight:800;background:var(--orange);color:#1b1100;border-radius:99px;padding:2px 10px;font-family:var(--body)}
.intro{margin:0 0 10px}
.intro p{margin:0 0 8px}
.part{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px dashed var(--line)}
.part:first-of-type{border-top:0}
.part .q{display:flex;gap:10px}
.part .q>b,.rpart .q>b{flex:none}
.rpart .q{display:flex;gap:10px}
.rpart .q .txt{min-width:0}
.rpart .q p{margin:0 0 6px}
.part .q .txt{min-width:0}
.part .q p{margin:0 0 6px}
.part .q ul{margin:4px 0 6px;padding-left:1.3rem}
.ppt{font-style:italic;color:var(--muted);white-space:nowrap}
.mc{list-style:none;margin:2px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.mc label{display:flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;background:var(--surface)}
.mc label:hover{border-color:var(--blue)}
.mc input{accent-color:var(--orange);width:18px;height:18px}
.mc input:checked+span{font-weight:800}
.mc label:has(input:checked){border-color:var(--orange);background:var(--orange-t)}
.fields{display:flex;flex-wrap:wrap;gap:8px 14px}
.field{display:flex;gap:6px;align-items:center}
.field input{width:9rem;max-width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.field input:focus{border-color:var(--orange);outline:none}
.paper{font-size:.88rem;color:var(--muted)}
.rec{display:inline-block;align-self:flex-start;width:fit-content;margin-top:6px;padding:2px 10px;border-radius:99px;background:var(--orange);color:#1b1000;font-weight:800;font-size:.8rem}
.selfhint{display:block;margin-top:6px;padding:8px 12px;border-radius:8px;background:var(--orange-t);border-left:4px solid var(--orange);color:var(--orange-ink);font-weight:800}
.hint{font-size:.9rem;color:var(--muted);font-style:italic}
img.fig{display:block;max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px;margin:8px 0}
table.tab{border-collapse:collapse;margin:8px 0;max-width:100%}
.tw{overflow-x:auto}
table.tab th,table.tab td{border:1px solid var(--line);padding:5px 11px;text-align:center}
table.tab th{background:var(--blue-t);color:var(--ink)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.15;font-size:.95em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.frac>span:last-child{padding:0 .2em}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.choose button{background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.choose button[aria-pressed="true"]{border-color:var(--orange);background:var(--orange-t)}
.choose b{font-family:var(--display)}
.choose small{color:var(--muted)}
.endbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface2);border-radius:14px;padding:14px 18px}
.big-clock{font-family:var(--display);font-weight:800;font-size:clamp(3rem,14vw,5.5rem);line-height:1;font-variant-numeric:tabular-nums;color:var(--blue);margin:8px 0}
:root[data-theme="dark"] .big-clock{color:var(--ink)}
.todo{margin:8px 0 0;padding-left:1.2rem}
.todo li{margin:3px 0}
/* Auswertung */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.sbox{background:var(--blue-t);border-radius:12px;padding:12px 14px}
.sbox small{display:block;color:var(--muted);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.sbox span{display:block}
.sbox b{font-family:var(--display);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.sbox.main{background:var(--orange-t)}
.band{font-weight:800}
.tbars{display:flex;flex-direction:column;gap:9px;margin:10px 0}
.tb{display:grid;grid-template-columns:minmax(8rem,16rem) minmax(0,1fr) 5.5rem;gap:10px;align-items:center;font-size:.95rem}
.tb .nm{font-weight:700;line-height:1.25}
.tb .tr{height:14px;background:var(--surface2);border-radius:8px;overflow:hidden}
.tb .tr i{display:block;height:100%;border-radius:8px}
.tb .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
.g-low i{background:var(--bad)}.g-mid i{background:var(--orange)}.g-hi i{background:var(--ok)}
@media (max-width:560px){.tb{grid-template-columns:minmax(0,1fr) 5rem}.tb .tr{grid-column:1/-1;order:3}}
.tips{display:flex;flex-direction:column;gap:12px}
.tip{border:1px solid var(--line);border-left:6px solid var(--orange);border-radius:0 12px 12px 0;padding:10px 16px;background:var(--surface)}
.tip h4{margin:0 0 4px;font-family:var(--display);font-size:1.05rem}
.tip ul{margin:4px 0 0;padding-left:1.2rem}
.tip li{margin:3px 0}
.rev{border-top:2px solid var(--line);padding-top:14px;margin-top:6px}
.rpart{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px dashed var(--line)}
.res{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.92rem}
.pill{border-radius:99px;padding:2px 10px;font-weight:800;font-size:.8rem}
.pill.ok{background:var(--ok-t);color:var(--ok)}.pill.bad{background:var(--bad-t);color:var(--bad)}.pill.self{background:var(--orange-t);color:var(--orange-ink)}
.mc.rv label{cursor:default}
.mc.rv label.right{border-color:var(--ok);background:var(--ok-t)}
.mc.rv label.wrong{border-color:var(--bad);background:var(--bad-t)}
.rate{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rate button{min-width:2.3rem;border:2px solid var(--line);background:var(--surface);border-radius:9px;padding:4px 9px;font-weight:800;cursor:pointer}
.rate button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#1b1100}
.rate.need button{border-color:var(--orange)}
details.sol{border:2px solid var(--orange);border-radius:12px;background:var(--sol-bg)}
details.sol summary{cursor:pointer;font-weight:800;padding:8px 14px;color:var(--orange-ink);font-family:var(--display)}
details.sol .in{padding:0 14px 10px}
details.sol .in p{margin:6px 0}
.ans{font-weight:800;color:var(--sol-ink)}
.red{color:var(--sol-ink)}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.nkey{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.nkey span{flex:1 1 70px;border:1px solid var(--line,#ccc);border-radius:8px;padding:6px 8px;text-align:center;font-size:.85rem}.nkey b{display:block;font-size:1.1rem}.nkey .on{background:var(--blue-d);color:#fff;border-color:transparent}
</style>
<header class="top"><div class="top-in">
  <div><h1>Prüfungs<em>trainer</em> E-Niveau</h1><p>Drei komplette Abschlussprüfungen Mathematik zum Üben, mit Timer, Pause und Selbstbewertung zwischen Teil 1 und Teil 2 und einer Auswertung mit Übungshinweisen.</p></div>
  <button class="theme" id="th" aria-label="Hell oder dunkel umschalten">◐ Hell/Dunkel</button>
</div></header>
<div id="barwrap"></div>
<main id="app"></main>
<div class="sr" id="live" aria-live="polite"></div>

eworfen:<\/p><p>24 &nbsp; 31 &nbsp; 27 &nbsp; 22 &nbsp; 35 &nbsp; 29<\/p>","parts":[{"id":"a","pts":1,"topic":"Statistische Kennwerte","type":"num","q":"Gib den Zentralwert (Median) der Torzahlen an.","sol":"Geordnet: 22, 24, 27, 29, 31, 35. Der Median liegt in der Mitte zwischen 27 und 29: (27 + 29) : 2 = 28.<p class=\"ans\">Median: 28 Tore<\/p>","fields":[{"label":"Median =","unit":"Tore","answer":"28","tol":0,"alt":["28"]}]},{"id":"b","pts":1,"topic":"Statistische Kennwerte","type":"num","q":"Gib die Spannweite der Torzahlen an.","sol":"35 − 22 = 13.<p class=\"ans\">Spannweite: 13 Tore<\/p>","fields":[{"label":"Spannweite =","unit":"Tore","answer":"13","tol":0,"alt":["13"]}]},{"id":"c","pts":1,"topic":"Statistische Kennwerte","type":"self","q":"Wähle aus den sechs Torzahlen drei Zahlen aus, deren Durchschnitt (arithmetisches Mittel) 30 beträgt.","sol":"Die Summe der drei Zahlen muss 3 · 30 = 90 betragen. Möglich ist z. B. 24 + 31 + 35 = 90, also (24 + 31 + 35) : 3 = 30. Prüft man alle Dreiergruppen über die Summe 90, ist dies die einzige Möglichkeit.<p class=\"ans\">z. B. 24, 31 und 35<\/p>"}]},{"id":"5","titel":"Berechne den ursprünglichen Preis.","intro":"<p>Der Eintritt in ein Museum kostet nach einer Preiserhöhung von 25 % jetzt 15 €.<\/p>","parts":[{"id":"a","pts":2,"topic":"Prozentrechnung","type":"num","q":"Berechne den Eintrittspreis vor der Erhöhung.","sol":"Der neue Preis entspricht 125 % des alten Preises: 125 % = 15 €, also 25 % = 3 € und 100 % = 12 €.<br>Probe: 12 € · 1,25 = 15 €.<p class=\"ans\">Der alte Preis betrug 12 €.<\/p>","fields":[{"label":"Preis =","unit":"€","answer":"12","tol":0,"alt":["12"]}]}]},{"id":"6","titel":"Kreuze die passende Beschreibung an.","intro":"<p>Eine Bahnstrecke wird nach der Häufigkeit von Verspätungen eingestuft:<\/p><table class=\"tab\"><tr><th>Einstufung<\/th><th>Anteil verspäteter Züge<\/th><\/tr><tr><td>Selten<\/td><td>weniger als 1 von 100<\/td><\/tr><tr><td>Gelegentlich<\/td><td>1 bis 5 von 100<\/td><\/tr><tr><t ische Funktionen und Parabeln","type":"self","q":"f(x) = ______________","sol":"<p>1 P: Scheitelform f(x) = a · (x − 3)<sup>2<\/sup> − 2.<\/p><p>1 P: a &gt; 0 (nach oben geöffnet), z. B. a = 1.<\/p><p class=\"ans\">z. B. f(x) = (x − 3)<sup>2<\/sup> − 2<\/p>"}]}]},"teil2":{"pflicht":[{"id":"1","titel":"Sockenschublade","themaA":"Stochastik","intro":"<p>In einer Schublade liegen 40 einzelne Socken, die sich nur in ihrer Farbe unterscheiden:<\/p><ul><li>18 weiße Socken (W),<\/li><li>14 schwarze Socken (S),<\/li><li>8 gestreifte Socken (G).<\/li><\/ul><p>Im Dunkeln wird zufällig eine Socke aus der Schublade gezogen.<\/p>","parts":[{"id":"a","pts":3,"topic":"Stochastik","type":"num","q":"Berechne die Wahrscheinlichkeit dafür, dass eine gestreifte Socke gezogen wird. Gib sie als Bruch (gekürzt) und als Prozentzahl an.","sol":"P(G) = {8/40} = {1/5} = 20 %.<p class=\"ans\">P(G) = {1/5} = 20 %<\/p>","fields":[{"label":"Bruch =","unit":"","answer":"0,2","alt":["0.2","1/5"],"tol":0},{"label":"Prozent =","unit":"%","answer":"20","alt":["20"],"tol":0}]},{"id":"b","pts":3,"topic":"Stochastik","type":"num","q":"Berechne die Wahrscheinlichkeit für das Ereignis: „Es wird eine weiße oder eine gestreifte Socke gezogen“. Gib die Wahrscheinlichkeit in Prozent an.","sol":"P(W oder G) = {18/40} + {8/40} = {26/40} = {13/20} = 65 %.<br>Kontrolle über das Gegenereignis: 1 − P(S) = 1 − {14/40} = {26/40}.<p class=\"ans\">P(W oder G) = {13/20} = 65 %<\/p>","fields":[{"label":"Prozent =","unit":"%","answer":"65","tol":0,"alt":["65"]}]},{"id":"c","pts":5,"topic":"Stochastik","type":"num","q":"Nun wird zwei Mal eine Socke gezogen. Nach dem ersten Zug wird die Socke zurückgelegt.<br>Berechne die Wahrscheinlichkeit für das Ereignis: „Es wird mindestens eine schwarze Socke gezogen“. Gib sie in Prozent an (gerundet auf eine Nachkommastelle).","sol":"<p>1 P: Gegenereignis „keine schwarze Socke“.<\/p><p>1 P: P(keine schwarze Socke) bei einem Zug = {26/40} = 0,65.<\/p><p>2 P: Pfadregel: P(zwei Mal keine schwarze) = 0,65 · 0,65 = 0,4225.<\/p><p>1 P: P(mindestens eine schwarze) = 1 − 0,4225 = 0,5775.<\/p><p class=\"ans\">P = 0,5775 ≈ 57,8 %<\/p>","fields":[{"label":"Prozent =","unit":"%","answer":"57,8","tol":0.05,"alt":["57.8","57,75","57.75"]}]},{"id":"d","pts":5,"topic":"Stochastik","type":"num","q":"Nun werden drei Socken nacheinander gezogen. Die gezogenen Socken werden nicht zurückgelegt.<br>Berechne die Wahrscheinlichkeit für das Ereignis: „Alle drei gezogenen Socken haben dieselbe Farbe“. Gib sie in Prozent an (gerundet auf eine Nachkommastelle).","sol":"<p>Es gibt drei Pfade (WWW, SSS, GGG), die mit der Pfadregel berechnet und addiert werden (3 P):<\/p><p>P(WWW) = {18/40} · {17/39} · {16/38} = {4896/59&nbsp;280} ≈ 0,0826<\/p><p>P(SSS) = {14/40} · {13/39} · {12/38} = {2184/59&nbsp;280} ≈ 0,0368<\/p><p>P(GGG) = {8/40} · {7/39} · {6/38} = {336/59&nbsp;280} ≈ 0,0057<\/p><p>Summe (2 P): {7416/59&nbsp;280} = {309/2470} ≈ 0,1251.<\/p><p class=\"ans\">P ≈ 12,5 %<\/p>","fields":[{"label":"Prozent =","unit":"%","answer":"12,5","tol":0.05,"alt":["12.5","12,51","12.51"]}]}]},{"id":"2","titel":"Straßentunnel","themaA":"Quadratische Funktionen","intro":"<p>Der Querschnitt eines Straßentunnels hat die Form einer Parabel. Mit einem Koordinatensystem (Ursprung auf der Fahrbahn in der Tunnelmitte) wird die obere Tunnelwand beschrieben durch<\/p><p>f(x) = −0,16x<sup>2<\/sup> + 4<\/p><p>x und f(x) werden in Metern angegeben.<\/p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAArkAAAGUCAYAAAAxhDrBAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAaJQAAGiUBh+i34AAAdSFJREFUeJzt3XV4U9cbB/DvjTR1BUpb3F3KkOFjyBg6hmwMhrsP3XCXMdydDYfB2BiD4T7cvVgp0FKhrknu74/SbvyalLakN8nt9/M8fYC8J/e+h0benJx7jiCKoggiIiIiIhlRmDsBIiIiIiJTY5FLRERERLLDIpeIiIiIZIdFLhERERHJDotcIiIiIpIdFrlEREREJDsscomIiIhIdljkEhEREZHssMglIiIiItlhkUtEREREssMil4iIiIhkh0UuEREREckOi1wiIiIikh0WuUREREQkOyxyiYiIiEh2WOQSERERkexYfZHr4+MDHx8fc6dBRERERBZEZe4EPlRUVJTZzh0aGgoA8P die Fahrbahn am Boden ist.","sol":"<p>1 P: Höhe in der Mitte: f(0) = 4, also 4 m (Scheitelpunkt S(0 | 4)).<\/p><p>2 P: Breite: −0,16x<sup>2<\/sup> + 4 = 0 ⇒ x<sup>2<\/sup> = 25 ⇒ x = −5 oder x = 5. Breite = 5 − (−5) = 10 m.<\/p><p class=\"ans\">Höhe 4 m; Breite 10 m<\/p>"},{"id":"b","pts":3,"topic":"Quadratische Funktionen","type":"self","q":"Ein Lkw ist 2,6 m breit und 3,5 m hoch und fährt genau in der Tunnelmitte. Entscheide durch Rechnung, ob er durch den Tunnel passt.","sol":"<p>1 P: Der Lkw reicht bis x = ±1,3.<\/p><p>2 P: f(1,3) = −0,16 · 1,3<sup>2<\/sup> + 4 = −0,2704 + 4 = 3,7296 ≈ 3,73 m. Das ist an der Stelle der oberen Lkw-Ecke die Tunnelhöhe, und 3,73 m &gt; 3,5 m.<\/p><p class=\"ans\">Der Lkw passt durch den Tunnel (Abstand nach oben ca. 0,23 m).<\/p>"},{"id":"c","pts":3,"topic":"Quadratische Funktionen","type":"num","q":"Berechne die Breite des Tunnels in einer Höhe von 3 m.","sol":"−0,16x<sup>2<\/sup> + 4 = 3 ⇒ −0,16x<sup>2<\/sup> = −1 ⇒ x<sup>2<\/sup> = 6,25 ⇒ x = ±2,5.<br>Breite: 2 · 2,5 m = 5 m.<p class=\"ans\">In 3 m Höhe ist der Tunnel 5 m breit.<\/p>","fields":[{"label":"Breite =","unit":"m","answer":"5","tol":0,"alt":["5"]}]},{"id":"d","pts":4,"topic":"Quadratische Funktionen","type":"self","q":"Ein Stahlseil wird geradlinig durch den Tunnel gespannt. Es liegt auf der Geraden g(x) = −0,16x + 2,08 und endet an beiden Seiten an der Tunnelwand.<br>Berechne die x-Koordinaten der beiden Befestigungspunkte.","sol":"<p>1 P: Gleichsetzen: −0,16x<sup>2<\/sup> + 4 = −0,16x + 2,08.<\/p><p>1 P: Umformen: −0,16x<sup>2<\/sup> + 0,16x + 1,92 = 0, durch −0,16 teilen: x<sup>2<\/sup> − x − 12 = 0.<\/p><p>1 P: pq-Formel: x = {1/2} ± √({1/4} + 12) = 0,5 ± 3,5.<\/p><p>1 P: x<sub>1<\/sub> = 4 und x<sub>2<\/sub> = −3 (Höhen: g(4) = 1,44 m und g(−3) = 2,56 m).<\/p><p class=\"ans\">Die Befestigungspunkte liegen bei x = −3 und x = 4.<\/p>"},{"id":"e","pts":3,"topic":"Quadratische Funktionen","type":"num","q":"Ein zweiter Tunnel ist 5 m hoch und am Boden 12 m breit. Auch sein Querschnitt ist parabelförmig, der Scheitelpunkt liegt auf der y-Achse. Stelle die Funktionsgleichung in der Form f(x) = a · x<sup>2<\/sup> + 5 auf.<br>Gib den Wert von a gerundet auf drei Nachkommastellen an.","sol":"1 P: Der Tunnel reicht von x = −6 bis x = 6, also f(6) = 0.<br>1 P: a · 36 + 5 = 0 ⇒ a = −{5/36}.<br>1 P: a ≈ −0,139, also f(x) ≈ −0,139x<sup>2<\/sup> + 5.<p class=\"ans\">a ≈ −0,139<\/p>","fields":[{"label":"a =","unit":"","answer":"-0,139","tol":0.0006,"alt":["-0.139","-0,1389","-0.1389"]}]}]}],"wahl":[{"id":"3","titel":"Zirkuszelt","empfohlen":true,"themaA":"Körper","intro":"<p>Ein Zirkuszelt besteht aus einem Zylinder mit aufgesetztem Kegel. Der Durchmesser des Zeltes beträgt 16 m, die Wand ist 4 m hoch, der Kegel ist 3 m hoch.<\/p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAApoAAAFYCAYAAADzxFzdAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAaJQAAGiUBh+i34AAAMvZJREFUeJzt3XeUU3X+//HXvWnTC70qIIKACoiICjbELqyKvfeyq67rqmtZXXv/uequvXwXC7pWFgsKig0rFhAVBAWRIgLTSzJJbu7vj0CYzGSYepPJzPNxDoe55XPvO0OA13ze994Ytm3bAgAAANqYmeoCAAAA0DERNAEAAOAIgiYAAAAcQdAEAACAIwiaAAAAcARBEwAAAI4gaAIAAMARBE0AAAA4gqAJAAAARxA0AQAA4AiCJgAAABxB0AQAAIAjCJoAAABwBEETAAAAjiBoAgAAwBEETQAAADiCoAkAAABHEDQBAADgCIImAAAAHEHQBAAAgCMImgAAAHAEQRMAAACOIGgCAADAEQRNAAAAOIKgCQAAAEcQNAEAAOAIgiYAAAAcQdAEAACAIwiaAAAAcARBEwAAAI4gaAIAAMARBE0AAAA4gqAJAAAARxA0AQAA4AiCJgAAABxB0AQAAIAjCJoAAABwhDvVBQAAGvbDsl/10pvz9N3SlZq8/26aPGmcCvJyUl0WADSJYdu2neoiAABbFJWU639zPtNLb87TD8t+jdvm9bh1wF6jdfQhE7TXbjvK7XalqEoAaBxBEwDagVA4rPc+/VYvvTlPcz9eqLBlNTqme9d8HXXQnpp6yAQNGdQ3CVUCQPMQNAEghTa3xv83+1MVlVa0+Dgjhw3U0YdOoLUOoF0haAJAkm2tNV5Xf1+FMlzR2c2A5dKqmtyt7k9rHUB7QtAEgCRoSWtckh4dPlcjc4skSQsruurcHyY2+Zy01gGkGkETABzUmtb42JFDdFP3l1VYsUSSFOwxSk9lX6TX3v1c6zaUNOtYtNYBpAJBEwDaWHNa43X169VNkyeN02ETx6pPz64KPzlZ9ur5kiSj31i5z3xNkUhEXy5aptfe+VzvfrxAgZpQk49Pax1AMhE0AaANtLQ1LklZmT4dMGG0Jk8ap9EjtpNhGLFtiYJmbZXVfr0zb4Fee+dzffP9z82qmdY6AKcRNAGgFVrbGp88aZz233OkMjN8CfdpLGjW9 as und Trigonometrie","type":"num","q":"Berechne den Neigungswinkel des Daches gegenüber der Waagerechten (gerundet auf eine Nachkommastelle).","sol":"tan α = {3/8} = 0,375 ⇒ α = tan<sup>−1<\/sup>(0,375) ≈ 20,6°.<p class=\"ans\">α ≈ 20,6°<\/p>","fields":[{"label":"α =","unit":"°","answer":"20,6","tol":0.1,"alt":["20.6","20,56"]}]},{"id":"e","pts":3,"topic":"Körper","type":"self","q":"Für das Zelt gilt: Pro Person müssen mindestens 4 m³ Luft vorhanden sein. Entscheide durch Rechnung, ob das Zelt für 260 Personen zugelassen werden darf.","sol":"<p>1 P: Kegelvolumen V<sub>K<\/sub> = {1/3} · π · 8<sup>2<\/sup> · 3 = 64π ≈ 201,1 m³.<\/p><p>1 P: Gesamtvolumen V = 804,2 m³ + 201,1 m³ ≈ 1005,3 m³.<\/p><p>1 P: 1005,3 : 4 ≈ 251 Personen (260 · 4 = 1040 m³ &gt; 1005,3 m³).<\/p><p class=\"ans\">Nein, das Zelt darf höchstens für 251 Personen zugelassen werden.<\/p>"}]},{"id":"4","titel":"Schimmel","themaA":"Exponentielles Wachstum","intro":"<p>Auf einer Brotscheibe breitet sich Schimmel aus. Zu Beobachtungsbeginn bedeckt er eine Fläche von 2 cm². Die bedeckte Fläche wächst jeden Tag um 40 %. Die Brotscheibe hat eine Fläche von 60 cm².<\/p>","parts":[{"id":"a","pts":2,"topic":"Exponentielles Wachstum","type":"num","q":"Berechne die vom Schimmel bedeckte Fläche nach 3 Tagen in cm² (gerundet auf eine Nachkommastelle).","sol":"Wachstumsfaktor 1,4: A(3) = 2 · 1,4<sup>3<\/sup> = 2 · 2,744 = 5,488 ≈ 5,5 cm².<p class=\"ans\">Nach 3 Tagen sind ca. 5,5 cm² bedeckt.<\/p>","fields":[{"label":"A =","unit":"cm²","answer":"5,5","tol":0.05,"alt":["5.5","5,49"]}]},{"id":"b","pts":3,"topic":"Exponentielles Wachstum","type":"num","q":"Berechne, nach wie vielen Tagen die Brotscheibe vollständig mit Schimmel bedeckt wäre (gerundet auf eine Nachkommastelle).","sol":"A(t) = 2 · 1,4<sup>t<\/sup> = 60 ⇒ 1,4<sup>t<\/sup> = 30 ⇒ t = lg 30 : lg 1,4 ≈ 10,1.<br>(1 P Ansatz, 1 P Umformen, 1 P Ergebnis)<p class=\"ans\">Nach ca. 10,1 Tagen ist die Scheibe ganz bedeckt.<\/p>","fields":[{"label":"t =","unit":"Tag alt":[],"tol":0},{"label":"β =","unit":"°","answer":"128","alt":[],"tol":0}]}]},{"id":"6","titel":"Berechne.","intro":"<p>Mia bekommt zum Schulabschluss 4&nbsp;000 € geschenkt. Sie legt den Betrag auf einem Konto mit 3,5 % Zinsen an.<\/p><p>Berechne, wie viel Geld sie nach einem Jahr auf dem Konto hat, wenn sie nichts abhebt.<\/p>","parts":[{"id":"a","pts":2,"topic":"Prozentrechnung","type":"num","q":"Kontostand nach einem Jahr:","sol":"<p>1 % von 4&nbsp;000 € = 40 €, also 3,5 % = 3 · 40 € + 20 € = 140 €.<\/p><p>4&nbsp;000 € + 140 € = 4&nbsp;140 €.<\/p><p class=\"ans\">Nach einem Jahr hat Mia 4&nbsp;140 € auf dem Konto.<\/p>","fields":[{"label":"","unit":"€","answer":"4140","alt":["4 140","4.140"],"tol":0}]}]},{"id":"7","titel":"Bestimme.","intro":"<p>Jule hat beim Pilzesammeln viermal so viele Pilze gefunden wie ihr Bruder Ben. Zusammen haben beide 60 Pilze.<\/p><p>Stelle eine Gleichung auf und bestimme, wie viele Pilze Ben gefunden hat.<\/p>","parts":[{"id":"a","pts":2,"topic":"Lineare Gleichungen und Formeln","type":"num","q":"Anzahl der Pilze von Ben:","sol":"<p>Ben: x; Jule: 4x. Gleichung: x + 4x = 60 (1 P).<\/p><p>5x = 60, also x = 12 (1 P).<\/p><p class=\"ans\">Ben hat 12 Pilze gefunden.<\/p>","fields":[{"label":"","unit":"Pilze","answer":"12","alt":[],"tol":0}]}]},{"id":"8","titel":"Ermittle.","intro":"<p>Ein Anbieter vermietet E-Roller zu zwei Tarifen:<\/p><table class=\"tab\"><tr><th>RollerGo<\/th><th>CityFlitz<\/th><\/tr><tr><td>Grundgebühr: 3 €,<br>20 Cent pro Fahrminute<\/td><td>keine Grundgebühr,<br>35 Cent pro Fahrminute<\/td><\/tr><\/table><p>Die Tarife können mit folgenden Funktionsgleichungen dargestellt werden:<\/p><p>RollerGo: f(x) = 0,2x + 3&nbsp;&nbsp;&nbsp;&nbsp;CityFlitz: g(x) = 0,35x<\/p><p>f(x) und g(x) stehen dabei für die Kosten in Euro, x steht für die Fahrminuten.<\/p><p>Ermittle, bei welcher Anzahl von Fahrminuten man bei beiden Tarifen gleich viel bezahlt.<\/p>","parts":[{"id":"a","pts":2,"topic":"Lineare Funktionen","type":"num","q":"Anzahl der Fahrminuten:","sol":"<p>f(x) = g(x): 0,2x + 3 = 0,35x (1 P)<\/p><p>3 = 0,15x, also x = 3 : 0,15 = 20 (1 P).<\/p><p>Probe: f(20) = 7, g(20) = 7.<\/p><p class=\"ans\">Bei 20 Fahrminuten kosten beide Tarife gleich viel (7 €).<\/p>","fields":[{"label":"","unit":"min","answer":"20","alt":[],"tol":0}]}]},{"id":"9","titel":"Zeichne.","intro":"<p>Zeichne ein Dreieck ABC mit α = 50°, β = 70° und c = 6 cm.<\/p>","parts":[{"id":"a","pts":1,"topic":"Konstruieren und Winkel","type":"self","q":"Zeichne das Dreieck auf Papier.","sol":"<p>Zeichne die Seite c = AB = 6 cm. Trage in A den Winkel 50° und in B den Winkel 70° an. Der Schnittpunkt der freien Schenkel ist C. Kontrolle: γ = 180° − 50° − 70° = 60°.<\/p><p>1 P für ein korrektes Dreieck (Seite und beide Winkel im Rahmen der Zeichengenauigkeit).<\/p>"}]},{"id":"10","titel":"Gib an.","intro":"<p>Der Körper wurde aus Würfeln mit dem Volumen 1 cm³ ohne Lücken gebaut.<\/p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAcQAAAHECAYAAACnX1ofAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAaJQAAGiUBh+i34AAAfO1JREFUeJztvXd4XOd5p32fM4Pee++9sHdRlKguWc2SbLnbib2JsylOtR1vNskm2fSNU5y99ktz77KtXtnE3gmCANF77wAJEnXmnO+PMzMAKRaUmTlzyOe+Ll0QCHLedwrO7/ye9ymKrus6giAIgnCXo5q9AUEQBEEIBEQQBUEQBAERREEQBEEARBAFQRAEARBBFARBEARABFEQBEEQABFEQRAEQQBEEAVBEAQBEEEUBEEQBEAEURAEQRAAEURBEARBAEQQBUEQBAEQQRQEQRAEQARREARBEAARREEQBEEARBAFQRAEARBBFARBEARABFEQBEEQABFEQRAEQQBEEAVBEAQBEEEUBEEQBEAEURAEQRAAEURBEARBAEQQBUEQBAEQQRQEQRAEQARREARBEAARREEQBEEARBAFQRAEARBBFARBEARABFEQBEEQABFEQRAEQQBEEAVBEAQBEEEUBEEQBEAEURAEQRAAEURBEARBAEQQBUEQBAEQQRQEQRAEQARREARBEAARREEQBEEARBAFQRAEARBBFARBEARABFEQBEEQABFEQRAEQQBEEAVBEAQBEEEUBEEQBEAEURAEQRAAEURBEARBAEQQBUEQBAEQQRQEQRAEQARREARBEAARREEQBEEARBAFQRAEARBBFARBEARABFEQBEEQABFEQRAEQQBEEAVBEAQBEEEUBEEQBEAEURAEQRAAEURBEARBAEQQBUEQBAEQQRQEQRAEQARREARBEAARREEQBEEARBAFQRAEARBBFARBEARABFEQBEEQABFEQRAEQQBEEAVBEAQBEEEUBEEQBEAEURAEQRAAEURBEARBAEQQBUEQBAEQQRQEQRAEQARREAR ic":"Körper","type":"num","q":"Gib an, wie viele Würfel beim Bauen verwendet wurden.","sol":"<p>Reihen mit 4, 3, 2 und 1 Würfel Höhe, jede Reihe 4 Würfel breit: 4 · (4 + 3 + 2 + 1) = 4 · 10 = 40.<\/p><p class=\"ans\">Es wurden 40 Würfel verwendet.<\/p>","fields":[{"label":"","unit":"Würfel","answer":"40","alt":[],"tol":0}]},{"id":"b","pts":1,"topic":"Körper","type":"num","q":"Gib an, wie viele Würfel noch gebraucht werden, um einen vollständigen Würfel mit der Kantenlänge 4 cm zu erhalten.","sol":"<p>Würfel 4 cm · 4 cm · 4 cm: 64 Einheitswürfel. 64 − 40 = 24.<\/p><p class=\"ans\">Es werden noch 24 Würfel gebraucht.<\/p>","fields":[{"label":"","unit":"Würfel","answer":"24","alt":[],"tol":0}]}]},{"id":"11","titel":"Ergänze.","intro":"<p>Die Tabelle zeigt die Kassenabrechnung einer Schach-AG. Der Kassenstand ergibt sich jeweils aus dem Kassenstand des Vormonats plus Einnahmen minus Ausgaben.<\/p><table class=\"tab\"><tr><th><\/th><th>A<\/th><th>B<\/th><th>C<\/th><th>D<\/th><\/tr><tr><th>1<\/th><td>Monat<\/td><td>Einnahmen in €<\/td><td>Ausgaben in €<\/td><td>Kassenstand in €<\/td><\/tr><tr><th>2<\/th><td>Januar<\/td><td>40<\/td><td>25<\/td><td>15<\/td><\/tr><tr><th>3<\/th><td>Februar<\/td><td>50<\/td><td>30<\/td><td>35<\/td><\/tr><tr><th>4<\/th><td>März<\/td><td>45<\/td><td>60<\/td><td>20<\/td><\/tr><tr><th>5<\/th><td>April<\/td><td>60<\/td><td>20<\/td><td>60<\/td><\/tr><tr><th>6<\/th><td>Summe<\/td><td>195<\/td><td>135<\/td><td><\/td><\/tr><\/table><ul><li>Gib zu dem Befehl die Zelle an.<\/li><li>Gib zu der Zelle den Befehl an.<\/li><\/ul><table class=\"tab\"><tr><th>Befehl<\/th><th>Zelle<\/th><\/tr><tr><td>= D3 + B4 − C4<\/td><td>&nbsp;<\/td><\/tr><tr><td>&nbsp;<\/td><td>C6<\/td><\/tr><\/table>","parts":[{"id":"a","pts":2,"topic":"Tabellenkalkulation","type":"self","q":"Ergänze die beiden fehlenden Angaben der Tabelle.","sol":"<p>Der Befehl = D3 + B4 − C4 rechnet: 35 + 45 − 60 = 20, das steht in Zelle <b>D4<\/b> (1 P).<\/p><p>In C6 steht die Summe der Ausgaben: <b>= SUMME(C2:C5)<\/b> (oder = C2 + C3 + C4 + C5) (1 P).<\/p>"}]}]},"teil2":{"pflicht":[{"id":"1","titel":"Bienenvölker","themaA":"Stochastik","intro":"<p>Imker schätzen, dass ein Bienenvolk den Winter in Norddeutschland mit einer Wahrscheinlichkeit von {1/8} nicht übersteht. Alle Völker werden unabhängig voneinander betrachtet.<\/p>","parts":[{"id":"a","pts":3,"topic":"Stochastik","type":"self","q":"Frau Ahlers hat ein Bienenvolk. Gib an, mit welcher Wahrscheinlichkeit es den Winter übersteht. Gib diese Wahrscheinlichkeit als Bruch, als Prozentsatz und als Dezimalzahl an.","sol":"<p>Gegenereignis: P(übersteht) = 1 − {1/8} = {7/8} (1 P).<\/p><p>{7/8} = 0,875 (1 P) = 87,5 % (1 P).<\/p><p class=\"ans\">Mit {7/8} = 87,5 % = 0,875 übersteht das Volk den Winter.<\/p>"},{"id":"b","pts":3,"topic":"Stochastik","type":"num","q":"Herr Brandt besitzt zwei Völker. Berechne die Wahrscheinlichkeit, dass beide den Winter nicht überstehen. Gib das Ergebnis in Prozent an (auf 0,1 % gerundet).","sol":"<p>Zwei unabhängige Ereignisse, Pfadregel (Multiplikation): P = {1/8} · {1/8} = {1/64} (2 P).<\/p><p>{1/64} = 0,015625 ≈ 1,6 % (1 P).<\/p><p class=\"ans\">Mit einer Wahrscheinlichkeit von {1/64} ≈ 1,6 % verliert Herr Brandt beide Völker.<\/p>","fields":[{"label":"P =","unit":"%","answer":"1,6","alt":["1.6","1,56"],"tol":0.05}]},{"id":"c","pts":4,"topic":"Stochastik","type":"num","q":"Ein Imkerverein hat drei Völker auf einer Streuobstwiese. Berechne die Wahrscheinlichkeit, dass mindestens eines dieser Völker den Winter nicht übersteht. Gib das Ergebnis in Prozent an (auf 0,1 % gerundet).","sol":"<p>Gegenereignis „mindestens ein Volk geht ein“ ist „alle drei überstehen den Winter“ (1 P).<\/p><p>P(alle drei überstehen) = {7/8} · {7/8} · {7/8} = {343/512} ≈ 0,670 (2 P).<\/p><p>P(mindestens eines geht ein) = 1 − {343/512} = {169/512} ≈ 0,330 (1 P).<\/p><p class=\"ans\">Mit etwa 33,0 % geht mindestens ein Volk ein.<\/p>","fields":[{"label":"P =","unit":"%","answer":"33,0","alt":["33","33.0"],"tol":0.05}]},{"id":"d","pts":3,"topic":"Stochastik","type":"num","q":"Eine Versicherung bietet an, Bienenvölker gegen Winterverluste zu versichern: Zu Beginn des Winters zahlt der Imker 30 € je Volk. Geht das Volk im Winter ein, zahlt die Versicherung 200 € an den Imker.<br>Die Versicherung hat 400 Verträge (je ein Volk) abgeschlossen. Berechne, mit welchem Gewinn die Versicherung rechnet.","sol":"<p>Einnahmen: 400 · 30 € = 12&nbsp;000 € (1 P).<\/p><p>Erwartete Verluste: {1/8} von 400 = 50 Völker; 50 · 200 € = 10&nbsp;000 € (1 P).<\/p><p>Gewinn: 12&nbsp;000 € − 10&nbsp;000 € = 2&nbsp;000 € (1 P).<\/p><p class=\"ans\">Die Versicherung rechnet mit einem Gewinn von 2&nbsp;000 €.<\/p>","fields":[{"label":"Gewinn:","unit":"€","answer":"2000","alt":["2 000","2.000"],"tol":0}]},{"id":"e","pts":3,"topic":"Stochastik","type":"self","q":"Für ein Armband fädelt Lina fünf Perlen in einer Reihe auf: zwei blaue (B) und drei gelbe (G) Perlen. Beispiel: B G G B G.<br>Schreibe alle möglichen Anordnungen der Perlen auf.","sol":"<p>Es gibt 10 verschiedene Anordnungen (Lage der beiden blauen Perlen: 4 + 3 + 2 + 1 = 10):<\/p><p>BBGGG, BGBGG, BGGBG, BGGGB, GBBGG, GBGBG, GBGGB, GGBBG, GGBGB, GGGBB<\/p><p>3 P für alle 10 ohne Doppelte (2 P bei 8–9 richtigen, 1 P bei systematischem Ansatz mit weniger).<\/p>"}]},{"id":"2","titel":"Radwegtunnel","themaA":"Quadratische Funktionen","intro":"<p>Ein Radweg führt durch einen Tunnel. Der Querschnitt des Tunnels hat die Form einer nach unten geöffneten Parabel. Er kann im Koordinatensystem durch die Funktion f mit<\/p><p>f(x) = −0,5 · (x − 3)² + 4,5<\/p><p>beschrieben werden (x und f(x) in Metern, x = 0 ist der linke Rand am Boden).<\/p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAApMAAAIlCAYAAACJhXOVAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAaJQAAGiUBh+i34AAAfuxJREFUeJzt3XdYFNcaBvB3d1mqdBFpggp2wd577CXRaOwtapreRFNMT4zpxhQTTTRRo0ZN7Mbee8PeFXsBFAQFKQtsm/uHkWScRWFhd3bZ9/c8Pt58M7vz "alt":["4.5"],"tol":0},{"label":"Breite am Boden:","unit":"m","answer":"6","alt":[],"tol":0}]},{"id":"b","pts":2,"topic":"Quadratische Funktionen","type":"self","q":"Am Punkt P(1 | 2,5) ist eine Lampe befestigt. Bestätige durch eine Rechnung, dass P auf dem Tunnelprofil liegt.","sol":"<p>f(1) = −0,5 · (1 − 3)² + 4,5 = −0,5 · 4 + 4,5 = −2 + 4,5 = 2,5 (2 P).<\/p><p class=\"ans\">f(1) = 2,5, also liegt P(1 | 2,5) auf der Parabel.<\/p>"},{"id":"c","pts":3,"topic":"Quadratische Funktionen","type":"self","q":"Forme den Funktionsterm von f in die Normalform (ax² + bx + c) um.","sol":"<p>f(x) = −0,5 · (x² − 6x + 9) + 4,5 (1 P, binomische Formel)<\/p><p>= −0,5x² + 3x − 4,5 + 4,5 (1 P)<\/p><p class=\"ans\">f(x) = −0,5x² + 3x (1 P)<\/p>"},{"id":"d","pts":2,"topic":"Quadratische Funktionen","type":"num","q":"Ein Lieferwagen ist 2,4 m breit und fährt mittig durch den Tunnel. Berechne die größtmögliche Höhe, die der Lieferwagen haben darf.","sol":"<p>Mittig: Abstand von der Mitte x = 3 ist 1,2 m, die Ränder liegen bei x = 1,8 und x = 4,2 (1 P).<\/p><p>f(1,8) = −0,5 · (1,8 − 3)² + 4,5 = −0,5 · 1,44 + 4,5 = 3,78 (1 P).<\/p><p class=\"ans\">Der Lieferwagen darf höchstens 3,78 m hoch sein.<\/p>","fields":[{"label":"Höhe:","unit":"m","answer":"3,78","alt":["3.78"],"tol":0.01}]},{"id":"e","pts":3,"topic":"Quadratische Funktionen","type":"num","q":"In 3 m Höhe soll ein Kabel quer durch den Tunnel gespannt werden. Berechne den Abstand der beiden Befestigungspunkte an den Tunnelwänden (auf cm gerundet).","sol":"<p>f(x) = 3: −0,5x² + 3x = 3 → x² − 6x + 6 = 0 (1 P).<\/p><p>x = 3 ± √(9 − 6) = 3 ± √3, also x<sub>1<\/sub> ≈ 1,27 und x<sub>2<\/sub> ≈ 4,73 (1 P).<\/p><p>Abstand: x<sub>2<\/sub> − x<sub>1<\/sub> = 2√3 ≈ 3,46 (1 P).<\/p><p class=\"ans\">Das Kabel ist etwa 3,46 m lang.<\/p>","fields":[{"label":"Abstand:","unit":"m","answer":"3,46","alt":["3.46"],"tol":0.01}]},{"id":"f","pts":3,"topic":"Quadratische Funktionen","type":"self","q":"Für die zweite Tunnelröhre gilt ebenfalls eine Höhe von 4,5 m, aber eine Breite am Boden von 8 m (x = 0 ist wieder der linke Rand am Boden). Gib eine Funktionsgleichung für das Profil dieser Röhre in Scheitelpunktform an.","sol":"<p>Scheitelpunkt: S(4 | 4,5) (1 P): f(x) = a(x − 4)² + 4,5.<\/p><p>Nullstelle bei x = 0: 0 = a · 16 + 4,5 → a = −4,5 : 16 = −{9/32} ≈ −0,28 (2 P).<\/p><p class=\"ans\">f(x) = −{9/32} · (x − 4)² + 4,5<\/p>"}]}],"wahl":[{"id":"3","titel":"Segelboot","themaA":"Flächen, Pythagoras und Trigonometrie","intro":"<p>Ein kleines Segelboot hat ein Großsegel in Form eines rechtwinkligen Dreiecks (Abb. 1). Der Mast ist 9 m lang, der Baum 4,5 m. Der Kiel des Bootes ist eine Bleiflosse (Abb. 2): Sie ist 12 cm dick und hat in der Seitenansicht die Form eines gleichschenkligen Trapezes.<\/p><p><b>Abb. 1<\/b><\/p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAUAAAAH5CAYAAADwVecXAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAaJQAAGiUBh+i34AAAK9xJREFUeJzt3WdgFIXaxfGzm00noYdQQ0dpiiBFQUQReUVUFBAVUUHFggX1il1UropiQy8qXsWuoGKhqnilCagU6VKlBAIEkpBC2mb3/RCzEtLLlpn5/75IpmyeUI5n2q7N7Xa7BQAWZPf3AADgLwQgAMsiAAFYFgEIwLIIQACWRQACsCwCEIBlEYAALIsABGBZBCAAyyIAAVgWAQjAsghAAJZFAAKwLAIQgGURgAAsiwAEYFkEIADLIgABWBYBCMCyCEAAlkUAArAsAhCAZRGAACyLAARgWQQgAMsiAAFYlsPfAxhVekamtv11oMzt2rVorBqR4T6YCEBFEYCVtO2vA7pq7KQyt/vq7cfUtWNrH0wEoKI4BAZgWQQgAMsiAAFYFgEIwLIIQACWRQACsCwCEIBlEYAALIsABGBZBCAAyyIAAVgWAQjAsghAAJZFAAKwLAIQgGURgAAsiwAEYFkEIADLIgABWBYBCMCyCEAAlkUAArAsAhCAZRGAACyLAARgWQQgAMsiAAFYFgEIwLIIQACWRQACsCwCEIBlEYAALIsABGBZBKCXHU067u8RAJSAAPSyrxeu8PcIAEpAAHrZouV/6ODhY/4eA0AxCEAvc+bl6c2P5/l7DADFIAB9YOacpbRAIAARgD6Qk+ukBQIBiAD0EVogEHgIQB+hBQKBhwD0IVogEFgIQB+iBQKBhQD0MVogEDgIQC/r2K5loa9pgUDgIAC9bOAFPYssowUCgYEA9LJmjRuoV9eOhZbRAoHAQAD6wPXDBhZZRgsE/I8A9IG2rZrRAoEARAD6CC0QCDwEoI/QAoHAQwD6EC0QCCwEoA/RAoHAQgD6GC0QCBwEoI/RAoHAQQD6AS0QCAwEoB/QAoHAQAD6CS0Q8D8C0E9ogYD/EYB+RAsE/IsA9CNaIOBfBKCf0QIB/yEA/YwWCPgPARgAaIGAfxCAAYAWCPgHARggaIGA7xGAAYIWCPgeARhAaIGAbxGAAYQWCPgWARhgaIGA7xCAAYYW =\"ans\">s ≈ 10,06 m<\/p>"},{"id":"c","pts":3,"topic":"Flächen, Pythagoras und Trigonometrie","type":"self","q":"Zeige durch Rechnung, dass der Winkel α an der Mastspitze (Abb. 1) ca. 26,57° beträgt.","sol":"<p>tan α = Gegenkathete : Ankathete = 4,5 : 9 = 0,5 (2 P).<\/p><p>α = tan<sup>−1<\/sup>(0,5) ≈ 26,57° (1 P).<\/p><p class=\"ans\">α ≈ 26,57°<\/p>"},{"id":"d","pts":3,"topic":"Flächen, Pythagoras und Trigonometrie","type":"num","q":"Das Segeltuch kostet 18,50 € pro m². Beim Zuschneiden entstehen 10 % Verschnitt, d. h. es muss 10 % mehr Tuch gekauft werden, als die Segelfläche beträgt. Berechne die Kosten für das Segeltuch.","sol":"<p>Benötigte Fläche: 20,25 m² · 1,1 = 22,275 m² (1 P).<\/p><p>Kosten: 22,275 · 18,50 € ≈ 412,09 € (2 P).<\/p><p class=\"ans\">Das Segeltuch kostet etwa 412,09 €.<\/p>","fields":[{"label":"Kosten:","unit":"€","answer":"412,09","alt":["412.09","412"],"tol":0.5}]},{"id":"e","pts":5,"topic":"Körper","type":"num","q":"Der Kiel besteht aus Blei (Dichte 11,3 g/cm³). Berechne die Masse des Kiels in kg.<ul><li>Berechne die Fläche des Trapezes (Abb. 2) in cm².<\/li><li>Berechne das Volumen des Kiels in dm³.<\/li><li>Berechne die Masse in kg.<\/li><\/ul>","sol":"<p>Trapez: A = {1/2} · (140 + 60) · 90 = 9&nbsp;000 cm² (2 P).<\/p><p>Volumen: V = 9&nbsp;000 cm² · 12 cm = 108&nbsp;000 cm³ = 108 dm³ (1 P).<\/p><p>Masse: 108&nbsp;000 cm³ · 11,3 g/cm³ = 1&nbsp;220&nbsp;400 g = 1&nbsp;220,4 kg (2 P).<\/p><p class=\"ans\">Der Kiel hat eine Masse von etwa 1&nbsp;220 kg.<\/p>","fields":[{"label":"Masse:","unit":"kg","answer":"1220,4","alt":["1220.4","1220"],"tol":1}]}]},{"id":"4","titel":"Milchschaum","themaA":"Exponentielles Wachstum","intro":"<p>Ein Barista beobachtet, wie die Höhe des Milchschaums auf einem Cappuccino mit der Zeit abnimmt. Das Diagramm zeigt die gemessenen Schaumhöhen in den ersten 10 Minuten.<\/p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAzgAAAIjCAYAAADP6r5uAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi  =MITTELWERT(B2:F2) (1 P). Das Gleichheitszeichen und die Division durch 5 sind nötig."},{"id":"b","pts":1,"topic":"Tabellenkalkulation","type":"num","q":"Das Feld F5 ist nicht zu erkennen. Ermittle, welche Zahl in dieses Feld eingegeben wurde.","fields":[{"label":"F5 =","unit":"","answer":"6","alt":[],"tol":0}],"sol":"Durchschnitt 8 bei 5 Würfen → Summe 5 · 8 = 40. Bekannt: 9 + 7 + 8 + 10 = 34. F5 = 40 – 34 = 6.<p class=\"ans\">In F5 steht die Zahl 6.<\/p>"}]}]},"teil2":{"pflicht":[{"id":"1","titel":"Kaffeekapseln","themaA":"Stochastik","intro":"<p>In einer Box befinden sich 40 Kaffeekapseln: 16 Kapseln der Sorte Espresso, 14 der Sorte Lungo und 10 entkoffeinierte Kapseln. Die Kapseln sind äußerlich nicht zu unterscheiden und werden zufällig entnommen.<\/p>","parts":[{"id":"a","pts":3,"topic":"Stochastik","type":"num","q":"Es wird eine Kapsel entnommen. Berechne die Wahrscheinlichkeit dafür, dass es eine Lungo-Kapsel ist. Gib die Wahrscheinlichkeit als Bruch (auf dem Papier), als Dezimalzahl und als Prozentzahl an.","fields":[{"label":"Dezimalzahl =","unit":"","answer":"0,35","alt":["0.35"],"tol":0},{"label":"Prozentzahl =","unit":"%","answer":"35","alt":[],"tol":0}],"sol":"P(Lungo) = {14/40} = {7/20} = 0,35 = 35 %.<br>1 P Bruch, 1 P Dezimalzahl, 1 P Prozentzahl.<p class=\"ans\">Die Wahrscheinlichkeit beträgt {7/20} = 0,35 = 35 %.<\/p>"},{"id":"b","pts":3,"topic":"Stochastik","type":"num","q":"Es werden nacheinander zwei Kapseln ohne Zurücklegen entnommen. Berechne die Wahrscheinlichkeit dafür, dass beide Kapseln entkoffeiniert sind. Gib das Ergebnis in Prozent an (auf eine Nachkommastelle gerundet).","fields":[{"label":"P =","unit":"%","answer":"5,8","alt":["5.8"],"tol":0.05}],"sol":"P = {10/40} · {9/39} = {90/1560} = {3/52} ≈ 0,0577 ≈ 5,8 %.<br>1 P Pfad, 1 P Rechnung, 1 P Ergebnis.<p class=\"ans\">Mit einer Wahrscheinlichkeit von etwa 5,8 % sind beide Kapseln entkoffeiniert.<\/p>"},{"id":"c","pts":4,"topic":"Stochastik","type":"num","q":"Es werden nun drei Kapseln ohne Zurücklegen entnommen. Berechne die Wahrscheinlichkeit dafür, dass mindestens eine Espresso-Kapsel dabei ist. Gib das Ergebnis in Prozent an (auf eine Nachkommastelle gerundet).","fields":[{"label":"P =","unit":"%","answer":"79,5","alt":["79.5"],"tol":0.05}],"sol":"Gegenereignis: keine Espresso-Kapsel (24 von 40 Kapseln sind keine Espresso).<br>P(keine Espresso) = {24/40} · {23/39} · {22/38} = {12&nbsp;144/59&nbsp;280} ≈ 0,2049<br>P(mindestens eine Espresso) = 1 – 0,2049 ≈ 0,7951 ≈ 79,5 %.<br>1 P Gegenereignis, 2 P Pfadprodukt, 1 P Ergebnis.<p class=\"ans\">Mit etwa 79,5 % ist mindestens eine Espresso-Kapsel dabei.<\/p>"},{"id":"d","pts":3,"topic":"Stochastik","type":"num","q":"Nun werden so lange Kapseln ohne Zurücklegen entnommen, bis eine entkoffeinierte Kapsel dabei ist. Berechne die Wahrscheinlichkeit dafür, dass erst die dritte Kapsel entkoffeiniert ist. Gib das Ergebnis in Prozent an (auf eine Nachkommastelle gerundet).","fields":[{"label":"P =","unit":"%","answer":"14,7","alt":["14.7"],"tol":0.05}],"sol":"Pfad: nicht entkoffeiniert, nicht entkoffeiniert, entkoffeiniert.<br>P = {30/40} · {29/39} · {10/38} = {8&nbsp;700/59&nbsp;280} ≈ 0,1468 ≈ 14,7 %.<br>1 P Pfad, 1 P Brüche, 1 P Ergebnis.<p class=\"ans\">Mit etwa 14,7 % ist erst die dritte Kapsel entkoffeiniert.<\/p>"},{"id":"e","pts":3,"topic":"Stochastik","type":"self","q":"Ein Probierpaket enthält nur vier Kapseln: 1 Espresso (E), 1 Lungo (L) und 2 entkoffeinierte (D). Es werden nacheinander drei Kapseln ohne Zurücklegen entnommen. Gib alle möglichen Ergebnisse (Kombinationen) an. Die Reihenfolge der Entnahme wird beachtet, die beiden entkoffeinierten Kapseln werden nicht unterschieden. Wahrscheinlichkeiten sind nicht gefragt.","sol":"Es gibt 12 Kombinationen: E-L-D, E-D-L, E-D-D, L-E-D, L-D-E, L-D-D, D-E-L, D-L-E, D-E-D, D-L-D, D-D-E, D-D-L.<br>3 P für alle 12; 2 P bei 9–11 richtigen; 1 P bei 5–8 richtigen (bzw. gültiges Baumdiagramm mit Fehlern)."}]},{"id":"2","titel":"Straßentunnel","themaA":"Quadratische Funktionen","intro":"<p>Der Querschnitt eines Straßentunnels wird durch die Funktion f mit f(x) = –0,3 · (x – 4)² + 4,8 beschrieben. Dabei sind x und f(x) in Metern angegeben. Die Fahrbahn liegt auf der x-Achse.<\/p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAArkAAAHtCAYAAAAdqWbIAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAaJQAAGiUBh+i34AAAjvlJREFUeJzs3XdUVFfXBvBnhqEXAVFAERAVe++919h7i7236GtNrEmssUVjjYqxJfbee49drKggKh1B6R3mfn8Y5nO8A6ICd5h5fmuxEve5ZR9mlM2Zc8+RCYIggIiIiIhIh8ilToCIiIiIKLuxyCUiIiIincMil4iIiIh0DotcIiIiItI5LHKJiIiISOewyCUiIiIincMil4iIiIh0DotcIiIiItI5LHKJiIiISOewyCUiIiIincMil4iIiIh0DotcIiIiItI5LHKJiIiISOewyCUiIiIincMil4iIiIh0DotcIiIiItI5LHKJiIiISOewyCUiIiIincMil4iIiIh0DotcIiIiItI5LHKJiIiISOewyCUiIiIincMil4iIiIh0DotcIiIiItI5LHKJiIiISOewyCUiIiIincMil4iIiIh0DotcIiIiItI5LHKJiIiISOcopE6AiMQEQcD27duhVCpRo0YNlC5dOsNjjx8/jrCwMPTs2RPGxsZZuv6JEyfw9u1b9OjRAyYmJtmVtkYRERE4fPgwAKBSpUqoWLFitlxXqVTi+vXruHz5Mt6+fQsbGxtUqVIFzZs3z/E+aas3b97g4sWLKF++PKpUqZIj9/Dy8sKQIUPQokULzJ49O0fu8TmHDh1CZGQk+vTpA4VCuh9j586dQ0BAQJaOlclk6NevXw5nlHsOHjyIqKgo9OvXDzKZTOp0iDQTiEjrXL58WQAgABA6d+6c6bG1atUSAAjh4eFZvn69evUEAEJISMi3ppqpq1evCs7Ozqq+zJkzJ1uu++bNG1UfPv1yc3MTbt68mS33yWv27t0rABCmTZuWY/dYtmyZAECws7MTlEqlKn7r1i3h5MmTQmJiotrxoaGhwsmTJ4Vnz55lWw7lypUTAAixsbHZds2v0bZtW43vQU1fCoVC0lyzW6lSpQQAQmpqqtSpEGWII7lEWmjbtm0APox8Hj16FO/fv4etra3EWWWdUqnEwoULMXv2bCgUCtStWxfXrl0THScIAl6+fInixYtn+dpXrlxBhw4dEBERgdq1a6NDhw4oX748Xr16hTNnzuDQoUOoV68e1q5di8GDB2dntwjA4MGDkZqailq1aqmN4E2ZMgUXL15EQEAAChcurIr/+++/6NixIyZNmoTFixdLkXKOmThxInr27KkWmzZtGgICArBkyRI4ODio4hztJMp9LHKJtExSUhL27NmDChUqYNiwYRg1ahR27dqFkSNHSp1alp09exbTp09HyZIlsXv3bpw5c0ZjkdupUyccOnQI06ZNw4IFCz573ZSUFAwdOhQRERGYOXMm5syZA7n8/x8tGD16NLZv346hQ4fihx9+QJs2beDo6JitfdN3VlZWmDx5stRpaIVGjRqJYgsXLkRAQAA6duyIYsWK5X5SRKTCIpdIyxw5cgSRkZEYM2YM2rVrh1GjRmHLli1ZKnIDAwPh4eEBX19fuLu7o3HjxqhVq1am5wQFBcHDwwMvX75EiRIl0KhRI9SpU+eb+iAIAvr27Yt169bB3NwcZ86c0Xict7c3AODFixdZuu7q1avx/PlztGnTB  m. (1 P Ansatz, 1 P Umformung, 1 P Ergebnis)<p class=\"ans\">Die Fahrbahn ist 8 m breit.<\/p>"},{"id":"c","pts":4,"topic":"Quadratische Funktionen","type":"self","q":"Ein Lkw ist 2,6 m breit und 4,2 m hoch und fährt genau in der Mitte des Tunnels. Untersuche durch Rechnung, ob der Lkw durch den Tunnel passt.","sol":"Der Lkw belegt die Fahrbahn von x = 4 – 1,3 = 2,7 bis x = 5,3. Entscheidend ist die Tunnelhöhe an den Rändern des Lkw (1 P).<br>f(2,7) = –0,3 · (2,7 – 4)² + 4,8 = –0,3 · 1,69 + 4,8 = 4,293 (2 P); wegen der Symmetrie ist f(5,3) = 4,293.<br>4,293 m &gt; 4,2 m (1 P).<p class=\"ans\">Der Lkw passt durch den Tunnel (nur knapp, mit etwa 9 cm Platz).<\/p>"},{"id":"d","pts":2,"topic":"Quadratische Funktionen","type":"self","q":"Zeige durch Rechnung, dass sich die Funktionsgleichung auch als f(x) = –0,3x² + 2,4x schreiben lässt.","sol":"(x – 4)² = x² – 8x + 16 (1 P)<br>f(x) = –0,3 · (x² – 8x + 16) + 4,8 = –0,3x² + 2,4x – 4,8 + 4,8 = –0,3x² + 2,4x (1 P)"},{"id":"e","pts":3,"topic":"Quadratische Funktionen","type":"num","q":"In welcher Entfernung vom linken Tunnelrand (x = 0) ist der Tunnel auf der linken Seite genau 4 m hoch? Runde auf eine Nachkommastelle.","fields":[{"label":"x =","unit":"m","answer":"2,4","alt":["2.4"],"tol":0.05}],"sol":"f(x) = 4: –0,3 · (x – 4)² + 4,8 = 4 → (x – 4)² = {0,8/0,3} ≈ 2,667 (1 P)<br>x – 4 = ±1,633 → x ≈ 2,37 oder x ≈ 5,63 (1 P). Links gilt x ≈ 2,4 (1 P).<p class=\"ans\">Etwa 2,4 m vom linken Rand entfernt ist der Tunnel 4 m hoch.<\/p>"},{"id":"f","pts":3,"topic":"Quadratische Funktionen","type":"self","q":"Ein zweiter Tunnel ist 10 m breit und in der Mitte 5 m hoch. Sein Querschnitt ist ebenfalls parabelförmig, der linke Rand liegt bei x = 0 und die Fahrbahn auf der x-Achse. Bestimme die Funktionsgleichung dieses Querschnitts.","sol":"Scheitelpunkt S(5 | 5): g(x) = a · (x – 5)² + 5 (1 P). Nullstelle bei x = 0: 0 = a · 25 + 5 → a = –0,2 (1 P).<br>g(x) = –0,2 · (x – 5)² + 5 (1 P) bzw. g(x) = –0,2x² + 2x."}]}],"wahl":[{"id":"3","tit h ist um etwa 39,8° geneigt.<\/p>"},{"id":"d","pts":4,"topic":"Körper","type":"num","q":"Im Vogelhaus steht ein zylinderförmiger Futterspender mit dem Radius 4 cm und der Höhe 15 cm. Er wird zu 80 % des Volumens mit Körnern gefüllt. Berechne, wie viele Milliliter Körner das sind. Runde auf ganze Milliliter.","fields":[{"label":"Körner =","unit":"ml","answer":"603","alt":["603,2"],"tol":1}],"sol":"V = π · r² · h = π · 4² · 15 ≈ 753,98 cm³ (2 P)<br>80 %: 0,8 · 753,98 ≈ 603,19 cm³ (1 P); 1 cm³ = 1 ml (1 P).<p class=\"ans\">Es sind etwa 603 ml Körner.<\/p>"},{"id":"e","pts":2,"topic":"Körper","type":"self","q":"Lukas behauptet: „Wenn man bei gleicher Höhe den Radius des Futterspenders verdoppelt, passt auch doppelt so viel hinein.“ Hat Lukas Recht? Entscheide und begründe. Du musst nicht rechnen.","sol":"Nein (1 P). Der Radius geht quadratisch in das Volumen ein (V = π · r² · h): Bei doppeltem Radius ist (2r)² = 4r², das Volumen wird also viermal so groß (1 P)."}]},{"id":"4","titel":"Borkenkäfer","themaA":"Exponentielles Wachstum","intro":"<p>In einem Waldstück (Wald 1) werden zu Beginn der Zählung 800 Borkenkäfer festgestellt. Ihre Zahl nimmt exponentiell um 22 % pro Woche zu.<\/p>","parts":[{"id":"a","pts":2,"topic":"Exponentielles Wachstum","type":"num","q":"Berechne, wie viele Borkenkäfer es nach 6 Wochen sind. Runde auf ganze Käfer.","fields":[{"label":"Anzahl =","unit":"","answer":"2638","alt":["2 638"],"tol":2}],"sol":"N(t) = 800 · 1,22<sup>t<\/sup> (1 P)<br>N(6) = 800 · 1,22<sup>6<\/sup> ≈ 2&nbsp;638 (1 P)<p class=\"ans\">Nach 6 Wochen sind es etwa 2&nbsp;638 Käfer.<\/p>"},{"id":"b","pts":4,"topic":"Exponentielles Wachstum","type":"num","q":"Berechne, nach wie vielen vollen Wochen es erstmals mehr als 10&nbsp;000 Käfer sind.","fields":[{"label":"Wochen =","unit":"","answer":"13","alt":[],"tol":0}],"sol":"800 · 1,22<sup>t<\/sup> = 10&nbsp;000 → 1,22<sup>t<\/sup> = 12,5 (1 P)<br>t = lg(12,5) : lg(1,22) ≈ 12,7 (2 P)<br>Probe: N(12) ≈ 8&nbsp;698 &lt; 10&nbsp;000, N( const TOPICS1=["Statistische Kennwerte","Konstruieren und Winkel","Prozentrechnung","Dreisatz, Verhältnisse und Maßstab","Einheiten umrechnen","Potenzen, Wurzeln und Terme","Rechnen mit Zahlen und Brüchen","Tabellenkalkulation","Flächen und Umfang","Lineare Gleichungen und Formeln","Lineare Funktionen","Quadratische Gleichungen","Körper","Lineare Gleichungssysteme","Quadratische Funktionen und Parabeln"];
const HINTS={
"Statistische Kennwerte":["Ordne die Werte zuerst der Größe nach. Dann liest du Median und Spannweite sicher ab. Bei gerader Anzahl ist der Median der Mittelwert der beiden mittleren Werte.","Übe: Minitest 01 „Statistische Kennwerte“ (E-Niveau)."],
"Konstruieren und Winkel":["Lerne die Winkelregeln: Nebenwinkel 180°, Scheitelwinkel gleich, Stufenwinkel an Parallelen gleich, Winkelsumme im Dreieck 180°.","Beim Konstruieren zuerst die gegebene Seite zeichnen, dann die Winkel antragen. Arbeite mit spitzem Bleistift und Geodreieck.","Übe: Minitest 02 „Konstruieren und Winkel“."],
"Prozentrechnung":["Schreibe Grundwert, Prozentwert und Prozentsatz immer heraus. Bei „nach 20 % Rabatt“ gilt: 80 % des alten Preises sind der neue Preis, also alter Preis = neuer Preis : 0,8.","Zinsen für ein Jahr: Kapital · Zinssatz, dann addieren.","Übe: Minitest 03 „Prozentrechnung“."],
"Dreisatz, Verhältnisse und Maßstab":["Rechne beim Dreisatz erst auf eine Einheit herunter. Beim Maßstab 1 : n gilt: Strecke auf der Karte · n = Strecke in Wirklichkeit, danach die Einheit umrechnen (cm in km: durch 100 000).","Übe: Minitest 04 „Dreisatz, Verhältnisse und Maßstab“."],
"Einheiten umrechnen":["Merke die Umrechnungszahlen: Länge 10, Fläche 100, Volumen 1000, Zeit 60. Es gilt 1 l = 1 dm³.","Schreibe bei Flächen und Volumen die Umrechnung in kleinen Schritten auf.","Übe: Minitest 05 „Einheiten umrechnen“."],
"Potenzen, Wurzeln und Terme":["Zehnerpotenzen: Zähle die Kommastellen. Wurzeln schätzt du zwischen zwei Quadratzahlen ab.","Binomische Formel: (a + b)(a − b) = a² − b². Beim Ausmultiplizieren jedes Glied mit jedem multiplizieren und auf die Vorzeichen achten.","Übe: Minitest 06 „Potenzen, Wurzeln und Terme“."],
"Rechnen mit Zahlen und Brüchen":["Brüche zuerst gleichnamig machen, dann addieren. Beim Multiplizieren Zähler mal Zähler, Nenner mal Nenner, zum Schluss kürzen.","Beachte Klammern und Punkt vor Strich. Prüfe das Ergebnis mit einem Überschlag.","Übe: Minitest 07 „Rechnen mit Zahlen und Brüchen“."],
"Tabellenkalkulation":["Eine Formel beginnt mit „=“. Zellen heißen Spalte plus Zeile, zum Beispiel C4. Suche bei „Zelle zur Formel“ die Spalte und die Zeile getrennt.","Übe: Minitest 08 „Tabellenkalkulation“."],
"Flächen und Umfang":["Lerne die Formeln für Fläche A und Umfang u von Rechteck, Dreieck und Kreis. Zerlege zusammengesetzte Figuren in einfache Teile.","Übe: Minitest 09 „Flächen und Umfang“."],
"Lineare Gleichungen und Formeln":["Löse Gleichungen mit Äquivalenzumformungen: auf beiden Seiten das Gleiche tun. Erst Klammern auflösen, dann sortieren. Mache die Probe durch Einsetzen.","Übe: Minitest 10 „Lineare Gleichungen und Formeln“."],
"Lineare Funktionen":["Steigung m = Höhenunterschied : Schritt nach rechts, b ist der Schnittpunkt mit der y-Achse. Den Schnittpunkt zweier Geraden findest du durch Gleichsetzen.","Übe: Minitest 11 „Lineare Funktionen“."],
"Quadratische Gleichungen":["Nutze die pq-Formel x = −{p/2} ± √(({p/2})² − q). Der Term unter der Wurzel zeigt, ob es 0, 1 oder 2 Lösungen gibt. Bei (x − a)² + b = c ziehst du die Wurzel und beachtest beide Vorzeichen.","Übe: Minitest 12 „Quadratische Gleichungen“."],
"Körper":["Würfelgebäude zählst du Schicht für Schicht. Volumen von Prisma und Zylinder: Grundfläche · Höhe. Bei Pyramide und Kegel kommt der Faktor {1/3} dazu.","Übe: Minitest 13 „Körper“."],
"Lineare Gleichungssysteme":["Wähle Einsetzen oder Gleichsetzen, wenn eine Gleichung schon nach einer Variablen aufgelöst ist. Mache die Probe in beiden Gleichungen.","Übe: Minitest 14 „Lineare Gleichungssysteme“."],

/* ---------- Bewertung ---------- */
function num(s){
  s=String(s==null?'':s).replace(/[\u2212\u2013\u2014]/g,'-').replace(/\u00a0|\s/g,'').replace(/[°%€]|[a-zA-Zµ²³]+$/g,'');
  if(!s)return NaN;
  if(/^-?\d+\/\d+$/.test(s)){const [a,b]=s.split('/');return +a/+b}
  s=s.replace('−','-').replace(/(?<!^-?0)\.(?=\d{3}(\D|$))/g,'').replace(',','.');
  return /^-?\d*\.?\d+$/.test(s)?parseFloat(s):NaN;
}
function auto(key,p){
  const a=S.ans[key]||{};
  if(p.type==='mc'){return a.i==null?'leer':a.i===p.correct?'ok':'bad'}
  if(p.type==='num'){
    const f=a.f||[];if(!p.fields.some((_,i)=>String(f[i]||'').trim()))return 'leer';
    const ok=p.fields.every((fl,i)=>{const v=num(f[i]);if(isNaN(v))return false;const t=(fl.tol||0)+1e-9;return [fl.answer,...(fl.alt||[])].some(x=>Math.abs(num(x)-v)<=t)});
    return ok?'ok':'bad';
  }
  return 'self';
}

  const w=wahlId()==='3'?e.teil2.wahl[0]:e.teil2.wahl[1];
  [...e.teil2.pflicht,w].forEach(a=>a.parts.forEach(p=>out.push({t:2,a,p,key:`t2.${a.id}${p.id}`,topic:p.topic==='Körper'?'Körper (Teil 2)':p.topic})));
  return out;
}
function got(x){const r=auto(x.key,x.p);if(r!=='self')return r==='ok'?x.p.pts:0;const s=S.score[x.key];return s!=null?s:0}

  return {t1,t2,total:t1+t2,topics,open};

   <div class="nkey">${[[1,'72–61'],[2,'60–51'],[3,'50–40'],[4,'39–29'],[5,'28–14'],[6,'13–0']].map(([n,r])=>`<span class="${n===gradeOf(sm.total)?'on':''}"><b>${n}</b>${r}</span>`).join('')}</div>
   ${gradeOf(sm.total)>1?`<p class="muted">Bis Note ${gradeOf(sm.total)-1} fehlen dir ${[0,61,51,40,29,14][gradeOf(sm.total)-1]-sm.total} Punkte.</p>`:''}
   <h3>Ergebnis nach Themen</h3><div class="tbars">${tops.map(t=>{const p=Math.round(100*t.pc);const c=p>=70?'g-hi':p>=50?'g-mid':'g-low';return `<div class="tb ${c}"><span class="nm">${esc(t.k)}</span><span class="tr"><i style="width:${p}%"></i></span><span class="v">${t.g}/${t.m} P</span></div>`}).join('')}</div>
  </section>
  <section class="card"><h2>Das übst du jetzt</h2>
   ${weak.length?`<div class="tips">${weak.map(t=>`<div class="tip"><h4>${esc(t.k)}: ${t.g} von ${t.m} Punkten</h4><ul>${(HINTS[t.k]||[]).map(x=>`<li>${fmt(x)}</li>`).join('')}</ul></div>`).join('')}</div>`:`<p>Alle Themen liegen bei mindestens 70 %. Mach weiter mit der nächsten Prüfung und achte auf die Zeit.</p>`}
   ${strong.length?`<p class="muted">Sicher bist du bei: ${strong.map(esc).join(', ')}.</p>`:''}
   <h3>Allgemeine Hinweise</h3><ul class="todo">${gen.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
   <p><button class="btn pri again">Zurück zur Prüfungsauswahl</button> ${nextEx?`<span class="muted">Tipp: Übe die Schwächen aus der Liste eine Woche lang und mach dann die nächste Prüfung.</span>`:''}</p>
  </section>
  <section class="card"><h2>Lösungen und Punkte</h2><p class="muted">Du hast dir bei der Selbstbewertung Punkte gegeben. Möchtest du etwas ändern?</p><p><button class="btn" id="torate">Bewertung und Lösungen nochmal ansehen</button></p></section>`;
}
function evalList(mode){
  const e=ex();let h='';
  const grp=(t,list,title)=>{let body='';list.forEach(([a,label])=>{
    const ps=a.parts.filter(p=>auto(`t${t}.${a.id}${p.id}`,p)==='self');if(!ps.length)return;
    body+=`<h4 style="margin:14px 0 4px;font-family:var(--display)">${esc(label)}</h4>${a.intro&&t===2?`<details><summary class="muted" style="cursor:pointer">Aufgabentext zeigen</summary><div class="intro">${fmt(a.intro)}</div></details>`:''}`;
    ps.forEach(p=>body+=revPart(`t${t}.${a.id}${p.id}`,p,a))});
    h+=`<div class="rev"><h3>${title}</h3>${body||'<p class="muted">Hier gibt es nichts selbst zu bewerten.</p>'}</div>`};
  if(mode===1){grp(1,e.teil1.aufgaben.map(a=>[a,`Aufgabe ${a.id}: ${a.titel.replace(/<[^>]+>/g,'')}`]),'Teil 1');return h}
  const w=wahlId();const w3=e.teil2.wahl[0],w4=e.teil2.wahl[1];
  grp(2,[[e.teil2.pflicht[0],'Aufgabe 1: '+e.teil2.pflicht[0].titel],[e.teil2.pflicht[1],'Aufgabe 2: '+e.teil2.pflicht[1].titel],[w==='3'?w3:w4,(w==='3'?'Aufgabe 3: ':'Aufgabe 4: ')+(w==='3'?w3:w4).titel]],'Teil 2 (gewertete Aufgaben)');
  h+=`<div class="choose" style="margin-top:14px"><button data-weval="3" aria-pressed="${w==='3'}"><b>Wahlaufgabe werten: Aufgabe 3 ${esc(w3.titel)}</b></button><button data-weval="4" aria-pressed="${w==='4'}"><b>Wahlaufgabe werten: Aufgabe 4 ${esc(w4.titel)}</b></button></div>`;
  return h;
}
function openT1(){const e=ex();let n=0;e.teil1.aufgaben.forEach(a=>a.parts.forEach(p=>{const k=`t1.${a.id}${p.id}`;if(auto(k,p)==='self'&&S.score[k]==null)n++}));return n}
function revPart(key,p,a){
  const r=auto(key,p);const a_=S.ans[key]||{};const cur=S.score[key];
  const dflt=r==='ok'?p.pts:r==='self'?null:0;
  const val=cur!=null?cur:dflt;
  let ans='';
  if(p.type==='mc')ans=`<ul class="mc rv">${p.options.map((o,i)=>`<li><label class="${i===p.correct?'right':a_.i===i?'wrong':''}"><span>${a_.i===i?'✔ ':''}${fmt(o)}</span></label></li>`).join('')}</ul>`;
  if(p.type==='num')ans=`<div class="res">Deine Eingabe: <b>${esc((a_.f||[]).map((v,i)=>(p.fields[i]&&p.fields[i].label?p.fields[i].label+' ':'')+(v||'–')).join(' · ')||'–')}</b></div>`;
  const pill=r==='ok'?'<span class="pill ok">Ergebnis richtig</span>':r==='bad'?'<span class="pill bad">Ergebnis stimmt nicht</span>':r==='leer'?'<span class="pill bad">nicht beantwortet</span>':'<span class="pill self">selbst bewerten</span>';
  const btns=Array.from({length:p.pts+1},(_,i)=>`<button data-sc="${key}" data-v="${i}" aria-pressed="${val===i}">${i}</button>`).join('');
  return `<div class="rpart"><div class="q"><b>${esc(p.id)})</b><div class="txt">${qpts(p.pts)} ${fmt(p.q)}</div></div>${ans}
   <div class="res">${p.type!=='self'?pill:pill}<span class="muted">Thema: ${esc(p.topic)}</span></div>
   <details class="sol"><summary>Lösung anzeigen</summary><div class="in">${fmt(p.sol)}</div></details>
   ${r==='self'?`<div class="rate ${val==null?'need':''}"><span>Meine Punkte (von ${p.pts}):</span>${btns}</div>`:`<div class="rate locked"><span>Punkte automatisch: <b>${r==='ok'?p.pts:0} von ${p.pts}</b></span></div>`}</div>`;
}
/* ---------- Ablauf ---------- */
function startExam(id){
  S=Object.assign(fresh(),{opts:S.opts,exam:id,stage:'t1'});
  warned={};
  const now=Date.now();S.t1={start:now,deadline:S.opts.timer?now+40*60000:0};save();render();
}
function finish1(){
  S.t1.used=Date.now()-S.t1.start;S.stage='pause';warned={};save();render();
}
function start2(){
  const now=Date.now();S.stage='t2';S.t2={start:now,deadline:S.opts.timer?now+80*60000:0};warned={};save();render();
}
function finish2(){
  S.t2.used=Date.now()-S.t2.start;S.stage='rate';warned={};save();render();
}
function toEval(){
  S.stage='eval';const sm=summary();saveHist(S.exam,sm.total);save();render();
}
function confirmBar(msg,yes,onYes){
  const c=$('#confirm');if(!c)return;
  c.innerHTML=`<div class="bar-in" style="padding-top:0"><span style="flex:1 1 14rem;font-weight:700">${msg}</span><button class="btn pri sm" id="cy">${yes}</button><button class="btn sm" id="cn">Weiter bearbeiten</button></div>`;
  $('#cy').onclick=onYes;$('#cn').onclick=()=>{c.innerHTML=''};
  $('#cy').focus();
}
function bind(){
  const q=(s,f)=>document.querySelectorAll(s).forEach(f);
  q('[data-start]',b=>b.onclick=()=>startExam(b.dataset.start));
  const ot=$('#o-timer');if(ot)ot.onchange=()=>{S.opts.timer=ot.checked;save()};
    const th=$('#hideclk');if(th)th.onclick=()=>{S.hideClock=!S.hideClock;th.textContent=S.hideClock?'Zeit zeigen':'Zeit ausblenden';th.setAttribute('aria-pressed',!!S.hideClock);updClock();save()};
  const doEnd1=()=>{const left=S.t1.deadline?S.t1.deadline-Date.now():0;if(S.opts.timer&&left>60000)confirmBar(`Teil 1 jetzt abgeben? Es bleiben noch ${mmss(left)} Minuten.`,'Ja, Teil 1 ist fertig',finish1);else finish1()};
  const e1=$('#end1');if(e1)e1.onclick=doEnd1;const e1b=$('#end1b');if(e1b)e1b.onclick=doEnd1;
  const doEnd2=()=>{const left=S.t2.deadline?S.t2.deadline-Date.now():0;if(S.opts.timer&&left>60000)confirmBar(`Prüfung jetzt abgeben? Es bleiben noch ${mmss(left)} Minuten.`,'Ja, abgeben',finish2);else finish2()};
  const e2=$('#end2');if(e2)e2.onclick=doEnd2;const e2b=$('#end2b');if(e2b)e2b.onclick=doEnd2;
  const g2=$('#go2');if(g2)g2.onclick=start2;const g2b=$('#go2b');if(g2b)g2b.onclick=start2;
  q('input[type=radio][data-k]',r=>r.onchange=()=>{(S.ans[r.dataset.k]=S.ans[r.dataset.k]||{}).i=+r.dataset.i;save()});
  q('input[type=text][data-k]',r=>r.oninput=()=>{const o=S.ans[r.dataset.k]=S.ans[r.dataset.k]||{};o.f=o.f||[];o.f[+r.dataset.f]=r.value;save()});
  q('[data-wahl]',b=>b.onclick=()=>{S.wahl=b.dataset.wahl;save();const y=window.scrollY;render();window.scrollTo(0,y)});
  q('[data-weval]',b=>b.onclick=()=>{S.wahlEval=b.dataset.weval;save();const y=window.scrollY;render();window.scrollTo(0,y)});
  q('[data-sc]',b=>b.onclick=()=>{S.score[b.dataset.sc]=+b.dataset.v;saveHist(S.exam,summary().total);save();const y=window.scrollY;render();window.scrollTo(0,y)});
  const g2c=$('#go2c');if(g2c)g2c.onclick=start2;const te=$('#toeval');if(te)te.onclick=toEval;const tr=$('#torate');if(tr)tr.onclick=()=>{S.stage='rate';save();render()};
  document.querySelectorAll('.again').forEach(ag=>ag.onclick=()=>{S=Object.assign(fresh(),{opts:S.opts});save();render()});
}
$('#th').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};
// Beim Neuladen mitten in der Prüfung: Zeiten laufen weiter (Frist ist absolut)
if(S.exam&&!EXAMS[S.exam])S=fresh();
render();
</script>
